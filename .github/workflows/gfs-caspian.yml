name: Build Caspian NOAA GFS GRIB

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5,11,17,23 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gfs-caspian.yml"
      - "scripts/build_gfs_caspian.py"

permissions:
  contents: write

concurrency:
  group: gfs-caspian-grib
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Build GFS Weather all horizons
        id: weather
        run: |
          python scripts/build_gfs_caspian.py \
            --mode weather \
            --all-horizons \
            --outdir output

      - name: Build GFS Wave all horizons
        id: wave
        run: |
          python scripts/build_gfs_caspian.py \
            --mode wave \
            --all-horizons \
            --outdir output

      - name: Validate all GFS products
        shell: bash
        run: |
          set -euo pipefail

          for DAYS in 3 5 7 10; do
            for KIND in WEATHER WAVE; do
              FILE="output/GFS_CASPIAN_${KIND}_${DAYS}D.grib2"
              test -s "$FILE"
              test "$(head -c 4 "$FILE")" = "GRIB"
              COUNT="$(grib_count "$FILE")"
              test "$COUNT" -gt 0
              echo "GFS ${KIND} ${DAYS}D: $COUNT messages"
            done
          done

          cp output/GFS_CASPIAN_WEATHER_5D.grib2 output/GFS_CASPIAN_WEATHER.grib2
          cp output/GFS_CASPIAN_WEATHER_5D_INFO.txt output/GFS_CASPIAN_WEATHER_INFO.txt
          cp output/GFS_CASPIAN_WAVE_5D.grib2 output/GFS_CASPIAN_WAVE.grib2
          cp output/GFS_CASPIAN_WAVE_5D_INFO.txt output/GFS_CASPIAN_WAVE_INFO.txt

          grib_ls -p shortName,dataDate,dataTime,stepRange,typeOfLevel \
            output/GFS_CASPIAN_WEATHER_10D.grib2 | head -n 100
          grib_ls -p shortName,dataDate,dataTime,stepRange,typeOfLevel \
            output/GFS_CASPIAN_WAVE_10D.grib2 | head -n 100

      - name: Upload short-lived artifact
        uses: actions/upload-artifact@v4
        with:
          name: GFS-Caspian-All-Horizons-${{ steps.weather.outputs.run_id }}
          path: |
            output/GFS_CASPIAN_WEATHER_*D.grib2
            output/GFS_CASPIAN_WEATHER_*D_INFO.txt
            output/GFS_CASPIAN_WAVE_*D.grib2
            output/GFS_CASPIAN_WAVE_*D_INFO.txt
          retention-days: 7
          if-no-files-found: error

      - name: Publish/update fixed GFS release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          cat > output/GFS_RELEASE_NOTES.md <<EOF
          NOAA/NCEP GFS Caspian products.

          Weather run: ${{ steps.weather.outputs.run_display }}
          Wave run: ${{ steps.wave.outputs.run_display }}
          Available forecast horizons: 3, 5, 7 and 10 days
          Area: 45E–56E, 35.5N–48.5N
          Grid: 0.25 degree

          Weather: 10 m wind, gust, MSLP, precipitation, visibility, 2 m temperature and dew point.
          Wave: significant combined wave height, primary wave direction and primary wave period.

          Unsuffixed files remain 5-day compatibility aliases.
          EOF

          if ! gh release view gfs-latest >/dev/null 2>&1; then
            gh release create gfs-latest \
              --title "Latest NOAA GFS Caspian — ${{ steps.weather.outputs.run_display }}" \
              --notes-file output/GFS_RELEASE_NOTES.md \
              --target "$GITHUB_SHA"
          fi

          gh release upload gfs-latest \
            output/GFS_CASPIAN_WEATHER_3D.grib2 \
            output/GFS_CASPIAN_WEATHER_3D_INFO.txt \
            output/GFS_CASPIAN_WEATHER_5D.grib2 \
            output/GFS_CASPIAN_WEATHER_5D_INFO.txt \
            output/GFS_CASPIAN_WEATHER_7D.grib2 \
            output/GFS_CASPIAN_WEATHER_7D_INFO.txt \
            output/GFS_CASPIAN_WEATHER_10D.grib2 \
            output/GFS_CASPIAN_WEATHER_10D_INFO.txt \
            output/GFS_CASPIAN_WAVE_3D.grib2 \
            output/GFS_CASPIAN_WAVE_3D_INFO.txt \
            output/GFS_CASPIAN_WAVE_5D.grib2 \
            output/GFS_CASPIAN_WAVE_5D_INFO.txt \
            output/GFS_CASPIAN_WAVE_7D.grib2 \
            output/GFS_CASPIAN_WAVE_7D_INFO.txt \
            output/GFS_CASPIAN_WAVE_10D.grib2 \
            output/GFS_CASPIAN_WAVE_10D_INFO.txt \
            output/GFS_CASPIAN_WEATHER.grib2 \
            output/GFS_CASPIAN_WEATHER_INFO.txt \
            output/GFS_CASPIAN_WAVE.grib2 \
            output/GFS_CASPIAN_WAVE_INFO.txt \
            --clobber

          gh release edit gfs-latest \
            --title "Latest NOAA GFS Caspian — ${{ steps.weather.outputs.run_display }}" \
            --notes-file output/GFS_RELEASE_NOTES.md
