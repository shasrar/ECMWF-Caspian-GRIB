name: Build Caspian ECMWF Wave GRIB

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8,20 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ecmwf-caspian.yml"
      - "scripts/build_caspian_grib.py"

permissions:
  contents: write

concurrency:
  group: ecmwf-caspian-grib
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cdo libeccodes-tools
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Download ECMWF fields for all horizons
        id: fetch
        run: |
          python scripts/build_caspian_grib.py \
            --all-horizons \
            --outdir output

      - name: Crop and validate all ECMWF horizons
        shell: bash
        run: |
          set -euo pipefail

          for DAYS in 3 5 7 10; do
            cdo -O -f grb2 sellonlatbox,45,56,35.5,48.5 \
              "output/ECMWF_GLOBAL_WAVE_TEMP_${DAYS}D.grib2" \
              "output/ECMWF_CASPIAN_WAVE_${DAYS}D.grib2"

            test -s "output/ECMWF_CASPIAN_WAVE_${DAYS}D.grib2"
            test "$(head -c 4 "output/ECMWF_CASPIAN_WAVE_${DAYS}D.grib2")" = "GRIB"

            COUNT="$(grib_count "output/ECMWF_CASPIAN_WAVE_${DAYS}D.grib2")"
            test "$COUNT" -gt 0
            SIZE="$(du -h "output/ECMWF_CASPIAN_WAVE_${DAYS}D.grib2" | awk '{print $1}')"

            {
              echo "Cropped GRIB messages: $COUNT"
              echo "Final file size: $SIZE"
            } >> "output/ECMWF_CASPIAN_WAVE_${DAYS}D_INFO.txt"

            echo "${DAYS}D: $COUNT messages, $SIZE"
            rm -f "output/ECMWF_GLOBAL_WAVE_TEMP_${DAYS}D.grib2"
          done

          cp output/ECMWF_CASPIAN_WAVE_5D.grib2 output/ECMWF_CASPIAN_WAVE.grib2
          cp output/ECMWF_CASPIAN_WAVE_5D_INFO.txt output/ECMWF_CASPIAN_WAVE_INFO.txt

      - name: Inspect representative ECMWF GRIB
        run: |
          grib_ls -p shortName,dataDate,dataTime,stepRange,typeOfLevel \
            output/ECMWF_CASPIAN_WAVE_10D.grib2 | head -n 100

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECMWF-Caspian-All-Horizons-${{ steps.fetch.outputs.run_id }}
          path: |
            output/ECMWF_CASPIAN_WAVE_3D.grib2
            output/ECMWF_CASPIAN_WAVE_3D_INFO.txt
            output/ECMWF_CASPIAN_WAVE_5D.grib2
            output/ECMWF_CASPIAN_WAVE_5D_INFO.txt
            output/ECMWF_CASPIAN_WAVE_7D.grib2
            output/ECMWF_CASPIAN_WAVE_7D_INFO.txt
            output/ECMWF_CASPIAN_WAVE_10D.grib2
            output/ECMWF_CASPIAN_WAVE_10D_INFO.txt
          retention-days: 7
          if-no-files-found: error

      - name: Publish/update fixed latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          cat > output/RELEASE_NOTES.md <<EOF
          ECMWF IFS-WAVE Open Data cropped to the Caspian Sea.

          Source run: ${{ steps.fetch.outputs.run_display }}
          Available forecast horizons: 3, 5, 7 and 10 days
          Area: 45E–56E, 35.5N–48.5N
          Fields: SWH, MWD, MWP, PP1D
          Source grid: 0.25 degree

          The unsuffixed ECMWF_CASPIAN_WAVE.grib2 remains a 5-day compatibility alias.
          EOF

          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              --title "Latest ECMWF Caspian Wave — ${{ steps.fetch.outputs.run_display }}" \
              --notes-file output/RELEASE_NOTES.md \
              --target "$GITHUB_SHA" \
              --latest
          fi

          gh release upload latest \
            output/ECMWF_CASPIAN_WAVE_3D.grib2 \
            output/ECMWF_CASPIAN_WAVE_3D_INFO.txt \
            output/ECMWF_CASPIAN_WAVE_5D.grib2 \
            output/ECMWF_CASPIAN_WAVE_5D_INFO.txt \
            output/ECMWF_CASPIAN_WAVE_7D.grib2 \
            output/ECMWF_CASPIAN_WAVE_7D_INFO.txt \
            output/ECMWF_CASPIAN_WAVE_10D.grib2 \
            output/ECMWF_CASPIAN_WAVE_10D_INFO.txt \
            output/ECMWF_CASPIAN_WAVE.grib2 \
            output/ECMWF_CASPIAN_WAVE_INFO.txt \
            --clobber

          gh release edit latest \
            --title "Latest ECMWF Caspian Wave — ${{ steps.fetch.outputs.run_display }}" \
            --notes-file output/RELEASE_NOTES.md \
            --latest
