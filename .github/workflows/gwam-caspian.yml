name: Build Caspian DWD GWAM GRIB

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5,17 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gwam-caspian.yml"
      - "scripts/build_gwam_caspian.py"

permissions:
  contents: write

concurrency:
  group: gwam-caspian-grib
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cdo libeccodes-tools
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Build DWD GWAM all horizons
        id: gwam
        run: |
          python scripts/build_gwam_caspian.py \
            --all-horizons \
            --outdir output

      - name: Validate all GWAM horizons
        shell: bash
        run: |
          set -euo pipefail

          for DAYS in 3 5 7; do
            FILE="output/DWD_GWAM_CASPIAN_WAVE_${DAYS}D.grib2"
            test -s "$FILE"
            test "$(head -c 4 "$FILE")" = "GRIB"
            COUNT="$(grib_count "$FILE")"
            test "$COUNT" -gt 0
            EXPECTED=$(( (DAYS * 24 / 3 + 1) * 13 ))
            test "$COUNT" -eq "$EXPECTED"
            echo "GWAM ${DAYS}D: $COUNT messages"
          done

          cp output/DWD_GWAM_CASPIAN_WAVE_5D.grib2 output/DWD_GWAM_CASPIAN_WAVE.grib2
          cp output/DWD_GWAM_CASPIAN_WAVE_5D_INFO.txt output/DWD_GWAM_CASPIAN_WAVE_INFO.txt

          grib_ls -p shortName,dataDate,dataTime,stepRange,typeOfLevel \
            output/DWD_GWAM_CASPIAN_WAVE_7D.grib2 | head -n 140

      - name: Upload short-lived artifact
        uses: actions/upload-artifact@v4
        with:
          name: DWD-GWAM-Caspian-All-Horizons-${{ steps.gwam.outputs.run_id }}
          path: |
            output/DWD_GWAM_CASPIAN_WAVE_3D.grib2
            output/DWD_GWAM_CASPIAN_WAVE_3D_INFO.txt
            output/DWD_GWAM_CASPIAN_WAVE_5D.grib2
            output/DWD_GWAM_CASPIAN_WAVE_5D_INFO.txt
            output/DWD_GWAM_CASPIAN_WAVE_7D.grib2
            output/DWD_GWAM_CASPIAN_WAVE_7D_INFO.txt
          retention-days: 7
          if-no-files-found: error

      - name: Publish/update fixed GWAM release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          cat > output/GWAM_RELEASE_NOTES.md <<EOF
          DWD GWAM global wave model cropped to the Caspian Sea.

          Source run: ${{ steps.gwam.outputs.run_display }}
          Available forecast horizons: 3, 5 and 7 days
          Area: 45E–56E, 35.5N–48.5N
          Grid: 0.25 degree

          Total sea: SWH, MWD, TM10
          Wind sea: SHWW, MDWW, MPWW, PPWW
          Swell: SHTS, MDTS, MPTS, PPTS
          Wave-model wind: SP_10M, DD_10M

          The unsuffixed file remains a 5-day compatibility alias.
          EOF

          if ! gh release view gwam-latest >/dev/null 2>&1; then
            gh release create gwam-latest \
              --title "Latest DWD GWAM Caspian — ${{ steps.gwam.outputs.run_display }}" \
              --notes-file output/GWAM_RELEASE_NOTES.md \
              --target "$GITHUB_SHA"
          fi

          gh release upload gwam-latest \
            output/DWD_GWAM_CASPIAN_WAVE_3D.grib2 \
            output/DWD_GWAM_CASPIAN_WAVE_3D_INFO.txt \
            output/DWD_GWAM_CASPIAN_WAVE_5D.grib2 \
            output/DWD_GWAM_CASPIAN_WAVE_5D_INFO.txt \
            output/DWD_GWAM_CASPIAN_WAVE_7D.grib2 \
            output/DWD_GWAM_CASPIAN_WAVE_7D_INFO.txt \
            output/DWD_GWAM_CASPIAN_WAVE.grib2 \
            output/DWD_GWAM_CASPIAN_WAVE_INFO.txt \
            --clobber

          gh release edit gwam-latest \
            --title "Latest DWD GWAM Caspian — ${{ steps.gwam.outputs.run_display }}" \
            --notes-file output/GWAM_RELEASE_NOTES.md
