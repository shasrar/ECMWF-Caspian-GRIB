name: Repair GFS Weather Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-gfs-weather-release.yml"

permissions:
  contents: write
  actions: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download validated Weather artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p keep
          gh run download 36303686850 \
            --repo "$GITHUB_REPOSITORY" \
            --name "GFS-Caspian-Weather-All-Horizons-20260927_00Z" \
            --dir keep

          cp keep/GFS_CASPIAN_WEATHER_5D.grib2 keep/GFS_CASPIAN_WEATHER.grib2
          cp keep/GFS_CASPIAN_WEATHER_5D_INFO.txt keep/GFS_CASPIAN_WEATHER_INFO.txt

      - name: Create Weather-only release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cat > notes.md <<EOF
          NOAA/NCEP GFS Weather subset for the Caspian Sea.

          Available forecast horizons: 3, 5, 7 and 10 days.
          GFS Wave is intentionally excluded because direct ecCodes validation
          showed only missing values over the Caspian Sea.
          EOF

          if ! gh release view gfs-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create gfs-latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest NOAA GFS Caspian Weather" \
              --notes-file notes.md \
              --target "$GITHUB_SHA"
          fi

          gh release upload gfs-latest \
            --repo "$GITHUB_REPOSITORY" \
            keep/GFS_CASPIAN_WEATHER_3D.grib2 \
            keep/GFS_CASPIAN_WEATHER_3D_INFO.txt \
            keep/GFS_CASPIAN_WEATHER_5D.grib2 \
            keep/GFS_CASPIAN_WEATHER_5D_INFO.txt \
            keep/GFS_CASPIAN_WEATHER_7D.grib2 \
            keep/GFS_CASPIAN_WEATHER_7D_INFO.txt \
            keep/GFS_CASPIAN_WEATHER_10D.grib2 \
            keep/GFS_CASPIAN_WEATHER_10D_INFO.txt \
            keep/GFS_CASPIAN_WEATHER.grib2 \
            keep/GFS_CASPIAN_WEATHER_INFO.txt \
            --clobber
