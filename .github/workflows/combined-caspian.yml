name: Build Caspian Combined Operational GRIB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/combined-caspian.yml"
  workflow_run:
    workflows:
      - "Build Caspian NOAA GFS Weather GRIB"
      - "Build Caspian DWD GWAM GRIB"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: combined-caspian-operational
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install ecCodes tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools

      - name: Download latest GFS Weather and GWAM release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input output

          gh release download gfs-latest \
            --repo "$GITHUB_REPOSITORY" \
            --dir input \
            --pattern 'GFS_CASPIAN_WEATHER_3D.grib2' \
            --pattern 'GFS_CASPIAN_WEATHER_3D_INFO.txt' \
            --pattern 'GFS_CASPIAN_WEATHER_5D.grib2' \
            --pattern 'GFS_CASPIAN_WEATHER_5D_INFO.txt' \
            --pattern 'GFS_CASPIAN_WEATHER_7D.grib2' \
            --pattern 'GFS_CASPIAN_WEATHER_7D_INFO.txt'

          gh release download gwam-latest \
            --repo "$GITHUB_REPOSITORY" \
            --dir input \
            --pattern 'DWD_GWAM_CASPIAN_WAVE_3D.grib2' \
            --pattern 'DWD_GWAM_CASPIAN_WAVE_3D_INFO.txt' \
            --pattern 'DWD_GWAM_CASPIAN_WAVE_5D.grib2' \
            --pattern 'DWD_GWAM_CASPIAN_WAVE_5D_INFO.txt' \
            --pattern 'DWD_GWAM_CASPIAN_WAVE_7D.grib2' \
            --pattern 'DWD_GWAM_CASPIAN_WAVE_7D_INFO.txt'

      - name: Build Combined Operational GRIB files
        shell: bash
        run: |
          set -euo pipefail

          # Match immutable GRIB2 identifiers, independent of ecCodes shortName.
          # GRIB2 numbers 35/36 may display as PPWW/PPTS or pp1dw/pp1ds.
          # discipline=10, category=0: 11 wave fields, no model wind.
          WAVE_PARAMETER_NUMBERS='3/14/15/5/4/6/35/8/7/9/36'

          EXPECTED_WAVE_IDENTITIES="$(printf '%s\n' \
            '10 0 3' '10 0 14' '10 0 15' '10 0 5' '10 0 4' \
            '10 0 6' '10 0 35' '10 0 8' '10 0 7' '10 0 9' \
            '10 0 36' | sort -u)"

          for DAYS in 3 5 7; do
            WEATHER="input/GFS_CASPIAN_WEATHER_${DAYS}D.grib2"
            GWAM="input/DWD_GWAM_CASPIAN_WAVE_${DAYS}D.grib2"
            WAVE_ONLY="output/GWAM_WAVE_ONLY_${DAYS}D.grib2"
            FINAL="output/CASPIAN_MARINE_COMPLETE_${DAYS}D.grib2"
            INFO="output/CASPIAN_MARINE_COMPLETE_${DAYS}D_INFO.txt"

            test -s "$WEATHER"
            test -s "$GWAM"
            test "$(head -c 4 "$WEATHER")" = "GRIB"
            test "$(head -c 4 "$GWAM")" = "GRIB"

            # Explicit wave-only selection (GWAM wind has discipline=0).
            grib_copy -w "discipline:i=10,parameterCategory:i=0,parameterNumber:i=$WAVE_PARAMETER_NUMBERS" \
              "$GWAM" "$WAVE_ONLY"

            WAVE_COUNT="$(grib_count "$WAVE_ONLY")"
            EXPECTED_TIMESTEPS=$(( DAYS * 24 / 3 + 1 ))
            EXPECTED_WAVE=$(( EXPECTED_TIMESTEPS * 11 ))
            if [ "$WAVE_COUNT" -ne "$EXPECTED_WAVE" ]; then
              echo "GWAM ${DAYS}D wave count mismatch: actual=$WAVE_COUNT expected=$EXPECTED_WAVE" >&2
              exit 1
            fi

            WAVE_IDENTITIES="$(grib_get -p discipline,parameterCategory,parameterNumber "$WAVE_ONLY" | sort -u)"
            if [ "$WAVE_IDENTITIES" != "$EXPECTED_WAVE_IDENTITIES" ]; then
              echo "GWAM ${DAYS}D wave GRIB2 identifier mismatch." >&2
              echo "Expected:" >&2
              printf '%s\n' "$EXPECTED_WAVE_IDENTITIES" >&2
              echo "Actual:" >&2
              printf '%s\n' "$WAVE_IDENTITIES" >&2
              exit 1
            fi

            # Each of the 11 wave parameters must cover all forecast timesteps.
            WAVE_ID_ROWS="$(grib_get -p discipline,parameterCategory,parameterNumber "$WAVE_ONLY")"
            while IFS= read -r WAVE_ID; do
              PER_PARAMETER_COUNT="$(printf '%s\n' "$WAVE_ID_ROWS" | grep -Fxc "$WAVE_ID")"
              if [ "$PER_PARAMETER_COUNT" -ne "$EXPECTED_TIMESTEPS" ]; then
                echo "GWAM ${DAYS}D timesteps incorrect for $WAVE_ID: actual=$PER_PARAMETER_COUNT expected=$EXPECTED_TIMESTEPS" >&2
                exit 1
              fi
            done <<< "$EXPECTED_WAVE_IDENTITIES"

            cat "$WEATHER" "$WAVE_ONLY" > "$FINAL"
            test -s "$FINAL"
            test "$(head -c 4 "$FINAL")" = "GRIB"

            WEATHER_COUNT="$(grib_count "$WEATHER")"
            FINAL_COUNT="$(grib_count "$FINAL")"
            EXPECTED_FINAL=$(( WEATHER_COUNT + WAVE_COUNT ))
            test "$FINAL_COUNT" -eq "$EXPECTED_FINAL"

            NAMES="$(grib_get -p shortName "$FINAL" | sort -u)"
            # Weather names stay checked; waves are validated by stable GRIB2 IDs.
            for REQUIRED in 10u 10v 2t 2d prmsl gust vis tp; do
              if ! echo "$NAMES" | grep -Fx "$REQUIRED" >/dev/null; then
                echo "Combined ${DAYS}D missing required weather field: $REQUIRED" >&2
                exit 1
              fi
            done

            if echo "$NAMES" | grep -Fx '10si' >/dev/null; then
              echo "Unexpected GWAM 10si retained" >&2
              exit 1
            fi
            if echo "$NAMES" | grep -Fx '10wdir' >/dev/null; then
              echo "Unexpected GWAM 10wdir retained" >&2
              exit 1
            fi

            GFS_RUN="$(grep -m1 '^Source run:' "input/GFS_CASPIAN_WEATHER_${DAYS}D_INFO.txt" | sed 's/^Source run:[[:space:]]*//')"
            GWAM_RUN="$(grep -m1 '^Source run:' "input/DWD_GWAM_CASPIAN_WAVE_${DAYS}D_INFO.txt" | sed 's/^Source run:[[:space:]]*//')"
            SIZE="$(du -h "$FINAL" | awk '{print $1}')"

            cat > "$INFO" <<EOF
          Caspian Marine Complete Operational GRIB
          Forecast horizon: ${DAYS} days
          Area: 45E-56E / 35.5N-48.5N

          Atmospheric source: NOAA/NCEP GFS
          GFS source run: ${GFS_RUN}
          Weather fields: 10m wind U/V, gust, MSLP, precipitation, visibility, 2m temperature, dew point

          Wave source: DWD GWAM
          GWAM source run: ${GWAM_RUN}
          Total sea: SWH, MWD, mean period
          Wind sea: height, direction, period, peak period
          Swell: height, direction, period, peak period
          GWAM 10m wind fields intentionally excluded to avoid duplicate wind sources.

          GRIB messages: ${FINAL_COUNT}
          File size: ${SIZE}

          Operational concept:
          Main file = GFS Weather + GWAM Wave
          Cross-check waves separately with ECMWF Wave.

          Planning/visualisation support only. Not a replacement for type-approved ECDIS, official ENC/MSI/warnings, SMS, or Master's navigational judgement.
          EOF

            echo "Combined ${DAYS}D: weather=${WEATHER_COUNT}, wave=${WAVE_COUNT}, total=${FINAL_COUNT}, size=${SIZE}"
          done

          cp output/CASPIAN_MARINE_COMPLETE_7D.grib2 output/CASPIAN_MARINE_COMPLETE.grib2
          cp output/CASPIAN_MARINE_COMPLETE_7D_INFO.txt output/CASPIAN_MARINE_COMPLETE_INFO.txt

      - name: Inspect combined 7-day file
        shell: bash
        run: |
          set -euo pipefail
          echo "Unique shortNames:"
          grib_get -p shortName output/CASPIAN_MARINE_COMPLETE_7D.grib2 | sort -u
          echo
          echo "Sample messages:"
          grib_ls -p shortName,dataDate,dataTime,stepRange,typeOfLevel \
            output/CASPIAN_MARINE_COMPLETE_7D.grib2 | head -n 160

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Caspian-Marine-Complete-Operational
          path: |
            output/CASPIAN_MARINE_COMPLETE_3D.grib2
            output/CASPIAN_MARINE_COMPLETE_3D_INFO.txt
            output/CASPIAN_MARINE_COMPLETE_5D.grib2
            output/CASPIAN_MARINE_COMPLETE_5D_INFO.txt
            output/CASPIAN_MARINE_COMPLETE_7D.grib2
            output/CASPIAN_MARINE_COMPLETE_7D_INFO.txt
          retention-days: 7
          if-no-files-found: error

      - name: Publish/update combined release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          GFS_RUN="$(grep -m1 '^GFS source run:' output/CASPIAN_MARINE_COMPLETE_7D_INFO.txt | sed 's/^GFS source run:[[:space:]]*//')"
          GWAM_RUN="$(grep -m1 '^GWAM source run:' output/CASPIAN_MARINE_COMPLETE_7D_INFO.txt | sed 's/^GWAM source run:[[:space:]]*//')"

          cat > output/COMBINED_RELEASE_NOTES.md <<EOF
          Caspian Marine Complete Operational GRIB.

          Main operational composition:
          - NOAA GFS Weather: wind, gust, MSLP, precipitation, visibility, temperature, dew point
          - DWD GWAM Wave: Total Sea, Wind Sea and Swell
          - GWAM 10m wind excluded to avoid duplicate wind sources

          Available horizons: 3, 5 and 7 days
          GFS source run: ${GFS_RUN}
          GWAM source run: ${GWAM_RUN}

          ECMWF Wave is the alternative cross-check. GFS Wave is excluded for the Caspian.
          EOF

          if ! gh release view combined-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create combined-latest --repo "$GITHUB_REPOSITORY" \
              --title "Latest Caspian Marine Complete Operational GRIB" \
              --notes-file output/COMBINED_RELEASE_NOTES.md \
              --target "${GITHUB_SHA}"
          fi

          gh release upload combined-latest --repo "$GITHUB_REPOSITORY" \
            output/CASPIAN_MARINE_COMPLETE_3D.grib2 \
            output/CASPIAN_MARINE_COMPLETE_3D_INFO.txt \
            output/CASPIAN_MARINE_COMPLETE_5D.grib2 \
            output/CASPIAN_MARINE_COMPLETE_5D_INFO.txt \
            output/CASPIAN_MARINE_COMPLETE_7D.grib2 \
            output/CASPIAN_MARINE_COMPLETE_7D_INFO.txt \
            output/CASPIAN_MARINE_COMPLETE.grib2 \
            output/CASPIAN_MARINE_COMPLETE_INFO.txt \
            --clobber

          gh release edit combined-latest --repo "$GITHUB_REPOSITORY" \
            --title "Latest Caspian Marine Complete — GFS ${GFS_RUN} / GWAM ${GWAM_RUN}" \
            --notes-file output/COMBINED_RELEASE_NOTES.md
